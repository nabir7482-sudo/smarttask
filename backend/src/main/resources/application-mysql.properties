# ===================================================================
# SmartTask - Optional MySQL Profile (Activate with --spring.profiles.active=mysql)
# ===================================================================

# MySQL Datasource Configuration (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarttask_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialec
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console when running in MySQL mode
spring.h2.console.enabled=false

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
