# ===================================================================
# SmartTask - Spring Boot Application Configuration (Default: H2 DB)
# ===================================================================

# Application Info
spring.application.name=SmartTask-Backend
server.port=8085

# -------------------------------------------------------------------
# H2 In-Memory Database Configuration (Zero-configuration local setup)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:smarttaskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8085/h2-console during local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialec
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Formatter for Dates
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Show validation messages in response bodies
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------
# JWT Authentication Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
